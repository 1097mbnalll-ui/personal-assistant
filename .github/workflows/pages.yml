# Tests and builds the 3D game (game3d/) and publishes it to the gh-pages branch, which GitHub Pages serves.
# The classic browser game is kept under /classic/.
name: Deploy game
on:
  push:
    branches-ignore: [gh-pages]
    paths: ['game3d/**', 'dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: game3d/package-lock.json }
      - run: npm ci
        working-directory: game3d
      - run: npm test
        working-directory: game3d
      - run: npm run build
        working-directory: game3d
      - name: Publish to gh-pages
        run: |
          mkdir -p game3d/dist/classic && cp dist/index.html game3d/dist/classic/index.html && touch game3d/dist/.nojekyll
          cd game3d/dist && git init -q -b gh-pages && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
