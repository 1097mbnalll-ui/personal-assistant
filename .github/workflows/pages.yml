# Builds the 3D game (game3d/) and publishes it with GitHub Pages. The classic browser game is kept under /classic/.
# One-time setup by the repository owner: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy game
on:
  push:
    paths: ['game3d/**', 'tools/fetch_assets.py', 'dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: game3d/package-lock.json }
      - run: npm ci
        working-directory: game3d
      - run: npm test
        working-directory: game3d
      - run: npm run build
        working-directory: game3d
      - run: mkdir -p game3d/dist/classic && cp dist/index.html game3d/dist/classic/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: game3d/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
