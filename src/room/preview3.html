<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1600" height="1000"></canvas>
<script src="room.js"></script><script src="office.js"></script><script src="office2.js"></script>
<script>
try{const q=new URLSearchParams(location.search);const sh=+(q.get('s')||0);const ss=+(q.get('ss')||2);
const t0=performance.now();
const R=RR.create(document.getElementById('c'),{ss});R.setAtlas(RR.atlas(RR.THEMES.ww2r.atlas));
const t1=performance.now();
const o=RR.office2();const sc=o.scene;sc.cast=R.buf(o.A);sc.nc=R.buf(o.N);
const gl=R.gl;let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,sc.rayArr,gl.STATIC_DRAW);sc.rays={b,n:sc.rayArr.length/4};
b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,sc.dustArr,gl.STATIC_DRAW);sc.dust={b,n:sc.dustArr.length/4};
R.render(sc,RR.CAMS2[sh]);gl.finish();
document.title='OK lod='+R.lodExt+' verts='+(o.A.d.length/16|0)+' atlas='+Math.round(t1-t0)+'ms render='+Math.round(performance.now()-t1)+'ms err='+gl.getError()}catch(e){document.title='ERR '+e.message+' '+(e.stack||'').slice(0,300)}
</script></body></html>
